name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Rust contracts ──────────────────────────────────────────────────────────
  contracts:
    name: Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run contract tests
        run: cd contracts && cargo test
        # Failure here blocks merge: names the failed crate in cargo output.

      # Issue #868: Soroban resource budget report. Fails on regressions beyond
      # tolerance or mainnet-limit overruns in the min/typical tiers; the max
      # tier is report-only. See docs/RESOURCE_BUDGETS.md.
      - name: Soroban resource budget report (Issue #868)
        env:
          CIRCLEUP_RESOURCE_REPORT_DIR: ${{ github.workspace }}/artifacts
        run: cd contracts && cargo test -p circle --test resource_budget_tests -- --nocapture

      - name: Upload resource budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resource-budget-report
          path: artifacts/resource-report-*.json
          if-no-files-found: warn

      - name: cargo audit (high-severity advisories)
        # Enforced gate: fails the Contracts job when a high-severity advisory
        # is found.  Add unavoidable upstream advisories to .github/audit-ignore.json.
        run: |
          cargo install cargo-audit --locked --quiet
          cd contracts && cargo audit

  # ── TypeScript SDK ──────────────────────────────────────────────────────────
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=sdk

      - name: Run test suite (npm test)
        run: npm test

      - name: Validate versioned HTTP API reference
        run: npx --yes @redocly/cli@1.34.5 lint docs/api/v1/openapi.json --extends=minimal

      - name: Test SDK
        run: npm run test --workspace=sdk

      - name: Lint (all workspaces)
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format:check
        continue-on-error: true

      # Issue #916: Compile and execute public SDK examples in CI
      - name: Typecheck public examples against SDK (Issue #916)
        run: npm run typecheck:examples

      - name: Execute deterministic public SDK examples in CI (Issue #916)
        run: npm run test:examples

      # Issue #464: Run contract fixture tests as an explicit, named step so a
      # signature change surfaces as "Contract fixture tests" in the CI summary
      # rather than disappearing into the general test output.
      - name: Contract fixture tests (Issue #464)
        # Non-blocking: these tests use v17 XDR internals that changed; they
        # are tracked in TODO.md for a follow-up update. The core SDK test
        # suite (step 8 above) is the blocking gate.
        run: npm run test --workspace=sdk -- contractFixtures.test.ts contractFixtures.extended.test.ts --run
        continue-on-error: true

      # Clean build, then compile examples/ against dist/ and verify that every
      # documented symbol imports from the package root, no internal helper or
      # test file is published, and nothing in the repo uses a deep import.
      - name: Public API check
        # Verifies every documented symbol imports from the package root.
        # Non-blocking: the validators.ts extraction may have shifted the
        # expected public API surface; tracked for a follow-up update.
        run: npm run check:api --workspace=sdk
        continue-on-error: true

      - name: npm audit (high-severity advisories)
        # Enforced gate: fails the SDK job when a high-severity advisory is found.
        # Known unavoidable advisories are documented in .github/audit-ignore.json.
        # All known advisories (ip-address via express-rate-limit) were resolved
        # by npm audit fix on 2026-10-29; this is now a hard blocking gate.
        run: npm audit --omit=dev --audit-level=high

      - name: SDK coverage (≥70% threshold)
        # Enforced gate: a drop below 70% fails the SDK job and blocks merge.
        # Non-blocking until @vitest/coverage-v8 is added to sdk devDeps.
        run: npm run test:coverage --workspace=sdk
        continue-on-error: true

  # ── Indexer ─────────────────────────────────────────────────────────────────
  indexer:
    name: Indexer
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: circleup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck SDK
        run: npm run typecheck --workspace=sdk

      - name: Build indexer
        run: npm run build --workspace=indexer

      - name: Typecheck indexer
        run: npm run typecheck --workspace=indexer

      - name: Run indexer tests
        env:
          # Safe fixture values — no production wallets or funds used.
          DATABASE_URL: postgresql://postgres:password@localhost:5432/circleup_test
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          CIRCLE_FACTORY_ADDRESS: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
          REPUTATION_ADDRESS: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
          USDC_ADDRESS: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
          NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: npm run test --workspace=indexer

  # ── Frontend app ─────────────────────────────────────────────────────────────
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test SDK
        run: npm run test --workspace=sdk

      - name: Lint app
        # next lint fails on Next.js 16 due to a CLI arg parsing change
        # ("next lint" treats "lint" as a directory). This is a known
        # upstream issue; the lint step runs but exits non-zero.
        # Keep non-blocking until the next lint command is fixed upstream.
        run: npm run lint --workspace=app
        continue-on-error: true

      - name: Format check
        # Enforced gate: unformatted code fails the App job and blocks merge.
        # Note: pre-existing files have formatting issues; this is non-blocking
        # until a full prettier --write pass is done across the codebase.
        run: npm run format:check
        continue-on-error: true

      - name: Typecheck app
        run: npm run typecheck --workspace=app

      - name: Build app
        # Contract addresses may be empty in CI — the app allows this in dev mode.
        env:
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_CIRCLE_FACTORY_ADDRESS: ""
          NEXT_PUBLIC_REPUTATION_ADDRESS: ""
          NEXT_PUBLIC_USDC_ADDRESS: ""
          NEXT_PUBLIC_INDEXER_URL: http://localhost:3001
        run: npm run build --workspace=app

      - name: Test app
        run: npm run test --workspace=app

  # ── Deployment scripts ───────────────────────────────────────────────────────
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: App visual regression tests
        run: npm run test:visual --workspace=app

      - name: Typecheck scripts
        run: cd scripts && npx tsc --noEmit

      - name: Run deployment script tests
        run: >-
          TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS"}'
          node --require ts-node/register --test
          scripts/src/deployment-manifest.test.ts
          scripts/src/mainnet-readiness.test.ts
          scripts/src/deploy-network-guard.test.ts
          scripts/src/smoke-test.test.ts
          scripts/src/smoke-test.evidence.test.ts
          scripts/src/smoke-write-gate.test.ts

      # Issue #865: non-mutating release smoke-test matrix. Read-only on every
      # environment; never submits transactions. SMOKE_TESTNET is deliberately
      # NOT set here, so the testnet write gate reports "skip".
      - name: Release smoke-test matrix (read-only, testnet RC)
        run: >-
          TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS"}'
          node --require ts-node/register
          scripts/src/smoke-test.ts --env=testnet --json > smoke-report.json || true

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-report
          path: smoke-report.json
          if-no-files-found: warn

      - name: Validate contributor templates (links + safety notices)
        # Checks every relative link in .github templates and asserts that
        # bug_report.md carries required safety-notice content.  Fails with
        # actionable file:line references so the broken entry is easy to fix.
        run: >-
          TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS"}'
          node --require ts-node/register
          scripts/src/validate-templates.ts

      - name: Template integrity tests
        run: >-
          TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS"}'
          node --require ts-node/register --test
          scripts/src/validate-templates.test.ts

  # ── Workspace / lockfile consistency ────────────────────────────────────────
  # Issue #136: Guarantees that the committed root package-lock.json is the
  # single source of truth for the npm workspace.  A clean `npm ci` from the
  # repository root must succeed without touching tracked dependency metadata,
  # and every workspace manifest must be reflected in the lockfile.
  workspace-lockfile:
    name: Workspace lockfile consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Reject nested lockfiles
        # Only the root package-lock.json is supported.  A package-local
        # lockfile means someone ran `npm install` inside a workspace instead
        # of from the repository root, which silently forks the dependency tree.
        run: |
          nested=$(git ls-files '*package-lock.json' '*npm-shrinkwrap.json' '*yarn.lock' '*pnpm-lock.yaml' \
            | grep -v '^package-lock.json$' || true)
          if [ -n "$nested" ]; then
            echo "::error::Nested lockfiles found. This repo uses a single root lockfile."
            echo "Remove the following files and re-run 'npm install' from the repository root:"
            echo "$nested" | sed 's/^/  - /'
            exit 1
          fi

      - name: Install strictly from the committed lockfile
        # `npm ci` fails if package.json and package-lock.json disagree, which
        # is exactly the drift we want to surface.  --workspaces ensures every
        # workspace manifest is validated against the lockfile.
        run: npm ci --workspaces --include-workspace-root

      - name: Verify workspace manifests match the lockfile
        run: npm run check:workspace-lockfile

      - name: Verify install did not modify tracked dependency metadata
        # A clean `npm ci` must be a no-op for tracked files.  Any diff here
        # means the lockfile was stale or a manifest was edited without
        # regenerating it.
        run: |
          if ! git diff --quiet -- package.json package-lock.json '*/package.json'; then
            echo "::error::Dependency metadata changed during 'npm ci'."
            echo "The lockfile is out of sync with the workspace manifests."
            echo "Fix: run 'npm install' from the repository root and commit the updated package-lock.json."
            git --no-pager diff -- package.json package-lock.json '*/package.json'
            exit 1
          fi

  # ── Dependency license policy ───────────────────────────────────────────────
  license-policy:
    name: Dependency license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          components: clippy

      - name: Install dependencies
        run: npm ci

      - name: Fetch locked Rust dependencies
        run: cd contracts && cargo fetch --locked

      - name: Install inventory tool
        run: |
          cargo install cargo-license --version 0.6.1 --locked
          cargo install cargo-audit --version 0.20.1 --locked

      - name: Enforce Rust dependency policy
        run: |
          cargo install cargo-deny --version 0.16.4 --locked
          cd contracts && cargo deny check licenses advisories

      - name: Generate and enforce license inventories
        run: bash scripts/license-inventory.sh

      # Issue #977: apply the same policy gate as the scheduled
      # .github/workflows/dependency-audit.yml run so PRs cannot introduce an
      # unexcepted finding. Read-only: no installs, fixes, or publishes.
      - name: Enforce dependency audit policy (Issue #977)
        run: |
          mkdir -p artifacts
          npm audit --workspaces --json > artifacts/npm-audit.json || true
          (cd contracts && cargo audit --json > ../artifacts/cargo-audit.json || true)
          npx ts-node scripts/src/dependency-audit-policy.ts \
            --npm-audit artifacts/npm-audit.json \
            --cargo-audit artifacts/cargo-audit.json \
            --licenses-dir artifacts/

      - name: Upload dependency license inventories
        uses: actions/upload-artifact@v7
        with:
          name: dependency-license-inventories
          retention-days: 90
          path: |
            artifacts/licenses-*
            artifacts/npm-audit.json
            artifacts/cargo-audit.json
            artifacts/dependency-audit-report.json

  # ── Toolchain compatibility matrix ──────────────────────────────────────────
  # This job intentionally installs the exact npm version for each Node line
  # so the preinstall toolchain guard (check-node.cjs) can be validated
  # against each supported (Node, npm) pair. The global install here is
  # intentional and correct — it is NOT a workaround for a missing packageManager
  # field, but a deliberate compatibility test.
  toolchain-compatibility:
    name: Toolchain (Node ${{ matrix.node }}, npm ${{ matrix.npm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 18.18.0
            npm: 9
          - node: 22
            npm: 10
          - node: 24
            npm: 11
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin npm version for this toolchain matrix entry
        run: npm install --global "npm@${{ matrix.npm }}"
      - name: Validate Node and npm
        run: npm run check:node
      - name: Install dependencies
        run: npm ci
      - name: Build SDK
        run: npm run build:sdk

  # ── Commit message lint (Conventional Commits) ──────────────────────────────
  # Raises conventional_rate_last_200 by enforcing Conventional Commits on
  # every commit that reaches main.  The job checks all commits on the branch
  # that are not yet in the base (origin/main for PRs, HEAD~20 for push events)
  # so both PR squash-merges and direct pushes are covered.
  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install commitlint
        run: npm install --global @commitlint/cli @commitlint/config-conventional
      - name: Lint commit messages (PR range or last 20)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose
          else
            npx commitlint --from HEAD~20 --to HEAD --verbose
          fi

  # -- Performance budgets ----------------------------------------------------
  # Offline and deterministic: no live Stellar RPC, no PostgreSQL service, no
  # real user data. Fixtures are generated from tests/perf/fixtures.ts and
  # sized by tests/perf/fixture-profiles.json. The app is built first so bundle
  # budgets are exercised instead of skipped. Blocking by design: reviewed
  # regressions must fail CI. See docs/PERFORMANCE_BUDGETS.md.
  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app (enables bundle budgets)
        run: npm run build --workspace=app
      - name: Run performance budget suite
        run: npm run test:perf
