name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Rust contracts ──────────────────────────────────────────────────────────
  contracts:
    name: Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run contract tests
        run: cd contracts && cargo test
        # Failure here blocks merge: names the failed crate in cargo output.

  # ── TypeScript SDK ──────────────────────────────────────────────────────────
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Select supported npm line
        run: npm install --global npm@9

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build --workspace=sdk

      - name: Test SDK
        run: npm run test --workspace=sdk

      # Issue #464: Run contract fixture tests as an explicit, named step so a
      # signature change surfaces as "Contract fixture tests" in the CI summary
      # rather than disappearing into the general test output.
      - name: Contract fixture tests (Issue #464)
        run: npm run test --workspace=sdk -- contractFixtures.test.ts contractFixtures.extended.test.ts --run

      # Clean build, then compile examples/ against dist/ and verify that every
      # documented symbol imports from the package root, no internal helper or
      # test file is published, and nothing in the repo uses a deep import.
      - name: Public API check
        run: npm run check:api --workspace=sdk

  # ── Indexer ─────────────────────────────────────────────────────────────────
  indexer:
    name: Indexer
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: circleup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Select supported npm line
        run: npm install --global npm@9

      - name: Install dependencies
        run: npm ci

      - name: Build indexer
        run: npm run build --workspace=indexer

      - name: Run indexer tests
        env:
          # Safe fixture values — no production wallets or funds used.
          DATABASE_URL: postgresql://postgres:password@localhost:5432/circleup_test
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          CIRCLE_FACTORY_ADDRESS: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
          REPUTATION_ADDRESS: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
          USDC_ADDRESS: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
          NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: npm run test --workspace=indexer

  # ── Frontend app ─────────────────────────────────────────────────────────────
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Select supported npm line
        run: npm install --global npm@9

      - name: Install dependencies
        run: npm ci

      - name: Lint app
        run: npm run lint --workspace=app

      - name: Build app
        # Contract addresses may be empty in CI — the app allows this in dev mode.
        env:
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_CIRCLE_FACTORY_ADDRESS: ""
          NEXT_PUBLIC_REPUTATION_ADDRESS: ""
          NEXT_PUBLIC_USDC_ADDRESS: ""
          NEXT_PUBLIC_INDEXER_URL: http://localhost:3001
        run: npm run build --workspace=app

      - name: Test app
        run: npm run test --workspace=app

  # ── Deployment scripts ───────────────────────────────────────────────────────
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Select supported npm line
        run: npm install --global npm@9

      - name: Install dependencies
        run: npm ci

      - name: Typecheck scripts
        run: cd scripts && npx tsc --noEmit

      - name: Run deployment script tests
        run: >-
          TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS"}'
          node --require ts-node/register --test
          scripts/src/deployment-manifest.test.ts
          scripts/src/mainnet-readiness.test.ts
          scripts/src/deploy-network-guard.test.ts

  # ── Dependency license policy ───────────────────────────────────────────────
  license-policy:
    name: Dependency license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Select supported npm line
        run: npm install --global npm@9

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          components: clippy

      - name: Install dependencies
        run: npm ci

      - name: Fetch locked Rust dependencies
        run: cd contracts && cargo fetch --locked

      - name: Install inventory tool
        run: cargo install cargo-license --version 0.6.1 --locked

      - name: Enforce Rust dependency policy
        run: |
          cargo install cargo-deny --version 0.16.4 --locked
          cd contracts && cargo deny check licenses advisories

      - name: Generate and enforce license inventories
        run: bash scripts/license-inventory.sh

      - name: Upload dependency license inventories
        uses: actions/upload-artifact@v7
        with:
          name: dependency-license-inventories
          path: artifacts/licenses-*

  toolchain-compatibility:
    name: Toolchain (Node ${{ matrix.node }}, npm ${{ matrix.npm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 18.18.0
            npm: 9
          - node: 22
            npm: 10
          - node: 24
            npm: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Select supported npm line
        run: npm install --global "npm@${{ matrix.npm }}"
      - name: Validate Node and npm
        run: npm run check:node
      - name: Install dependencies
        run: npm ci
      - name: Build SDK
        run: npm run build:sdk
