# CI — Contract build reproducibility and provenance verification (Issues #396, #705)
#
# Builds Soroban WASM artifacts twice from a clean state using the pinned
# toolchain in contracts/rust-toolchain.toml, then verifies that the
# resulting artifacts match the expected hashes in
# contracts/expected-hashes.json and generates release provenance metadata.
#
# This workflow:
#   - Never deploys contracts or submits transactions.
#   - Requires no deployment secrets.
#   - Fails fast when toolchain drift or source changes alter artifact bytes.
#   - Publishes reproducible release WASM artifacts with cryptographically verifiable provenance.

name: Contract Build Reproducibility

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/reproducibility.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/reproducibility.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  reproducibility:
    name: Verify WASM artifact hashes & provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install the exact Rust toolchain declared in contracts/rust-toolchain.toml.
      # The toolchain file is picked up automatically by rustup.
      - name: Install pinned Rust toolchain
        working-directory: contracts
        run: |
          rustup show           # triggers rust-toolchain.toml install
          rustup show active-toolchain
          cargo --version
          rustc --version

      # Fail fast if the active toolchain differs from the pinned one, or if the
      # wasm32-unknown-unknown target is missing. This prevents a silently
      # floating toolchain from rewriting artifact hashes.
      - name: Verify pinned toolchain and target
        working-directory: contracts
        run: |
          set -euo pipefail
          PINNED_CHANNEL="$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml | head -n1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')"
          if [ -z "${PINNED_CHANNEL}" ]; then
            echo "::error::Could not read pinned channel from contracts/rust-toolchain.toml"
            exit 1
          fi
          ACTIVE_CHANNEL="$(rustup show active-toolchain | awk '{print $1}')"
          echo "Pinned channel: ${PINNED_CHANNEL}"
          echo "Active toolchain: ${ACTIVE_CHANNEL}"
          case "${ACTIVE_CHANNEL}" in
            "${PINNED_CHANNEL}"*) ;;
            *)
              echo "::error::Active toolchain '${ACTIVE_CHANNEL}' does not match pinned '${PINNED_CHANNEL}'"
              exit 1
              ;;
          esac
          if ! rustup target list --installed --toolchain "${ACTIVE_CHANNEL}" | grep -qx 'wasm32-unknown-unknown'; then
            echo "::error::wasm32-unknown-unknown target is not installed for ${ACTIVE_CHANNEL}"
            exit 1
          fi
          echo "wasm32-unknown-unknown target is installed"

      # Cache compiled dependencies to speed up repeated runs.
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      # First build — produces the artifacts under contracts/target/
      - name: Build contracts (first pass)
        working-directory: contracts
        run: |
          cargo build --release --target wasm32-unknown-unknown
          echo "=== First-pass artifact sizes ==="
          ls -lh target/wasm32-unknown-unknown/release/*.wasm
          mkdir -p ../.repro/first-pass
          cp target/wasm32-unknown-unknown/release/*.wasm ../.repro/first-pass/
          (cd ../.repro/first-pass && sha256sum *.wasm | sort -k2 > ../first-pass.sha256)
          echo "=== First-pass hashes ==="
          cat ../.repro/first-pass.sha256

      # Generate provenance metadata for the built artifacts
      - name: Generate build provenance metadata
        working-directory: scripts
        run: npx ts-node src/check-artifact-hashes.ts --provenance

      # Verify hashes against contracts/expected-hashes.json.
      # Fails CI if there is any bytecode drift or unpopulated expected hashes.
      - name: Verify artifact hashes against expected-hashes.json
        working-directory: scripts
        run: npx ts-node src/check-artifact-hashes.ts

      # Second build from a clean state to confirm byte-for-byte reproducibility.
      - name: Clean and rebuild (second pass)
        working-directory: contracts
        run: |
          cargo clean
          cargo build --release --target wasm32-unknown-unknown
          echo "=== Second-pass artifact sizes ==="
          ls -lh target/wasm32-unknown-unknown/release/*.wasm
          mkdir -p ../.repro/second-pass
          cp target/wasm32-unknown-unknown/release/*.wasm ../.repro/second-pass/
          (cd ../.repro/second-pass && sha256sum *.wasm | sort -k2 > ../second-pass.sha256)
          echo "=== Second-pass hashes ==="
          cat ../.repro/second-pass.sha256

      # Both passes must produce identical hashes.
      - name: Compare first and second pass hashes
        working-directory: .repro
        run: |
          set -euo pipefail
          if ! diff -u first-pass.sha256 second-pass.sha256; then
            echo "::error::First and second build passes produced different WASM hashes"
            exit 1
          fi
          echo "Both build passes produced identical WASM hashes"

      # Verify hashes against the reviewed expected-hashes.json.
      - name: Verify artifact hashes against expected-hashes.json
        working-directory: scripts
        run: npx ts-node src/check-artifact-hashes.ts

      # Emit the exact toolchain, SDK, target, and build flags used, alongside
      # the WASM hashes, so any compiler/SDK change is visible in release output.
      - name: Report toolchain and artifact evidence
        working-directory: contracts
        run: |
          set -euo pipefail
          {
            echo "## Contract build toolchain evidence"
            echo ""
            echo "- rustc: \`$(rustc --version)\`"
            echo "- cargo: \`$(cargo --version)\`"
            echo "- active toolchain: \`$(rustup show active-toolchain)\`"
            echo "- target: \`wasm32-unknown-unknown\`"
            echo "- build flags: \`--release --target wasm32-unknown-unknown\`"
            echo ""
            echo "### Soroban SDK versions"
            echo ""
            echo '```'
            grep -E '^name = "soroban-sdk"' -A1 Cargo.lock || true
            echo '```'
            echo ""
            echo "### WASM hashes"
            echo ""
            echo '```'
            cat ../.repro/first-pass.sha256
            echo '```'
          } | tee ../.repro/toolchain-evidence.md
          {
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "toolchain=$(rustup show active-toolchain)"
            echo "target=wasm32-unknown-unknown"
            echo "build_flags=--release --target wasm32-unknown-unknown"
            grep -E '^name = "soroban-sdk"' -A1 Cargo.lock | tr '\n' ' ' || true
            echo ""
          } > ../.repro/toolchain-evidence.txt
          cat ../.repro/toolchain-evidence.txt

      - name: Upload toolchain evidence
        uses: actions/upload-artifact@v7
        with:
          name: contract-toolchain-evidence
          path: |
            .repro/toolchain-evidence.md
            .repro/toolchain-evidence.txt
            .repro/first-pass.sha256
            .repro/second-pass.sha256
          if-no-files-found: error

      # Upload release provenance artifact
      - name: Upload build provenance metadata
        uses: actions/upload-artifact@v7
        with:
          name: contract-provenance
          path: contracts/provenance.json
          if-no-files-found: error

      # Upload verifiable release WASM binaries
      - name: Upload compiled contract WASMs
        uses: actions/upload-artifact@v7
        with:
          name: release-wasm-artifacts
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

      - name: Print toolchain info
        if: always()
        working-directory: contracts
        run: |
          rustc --version
          cargo --version
          rustup show
          rustup target list --installed || true
