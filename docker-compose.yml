version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: circleup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      # Named volume holding the local PostgreSQL data directory
      # (/var/lib/postgresql/data). It persists across `docker compose down`
      # and container restarts, so test data survives a service restart.
      # It is only removed by an explicit `docker compose down -v` or by
      # deleting the named volume directly (see reset instructions below).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Readiness probe: reports healthy only once PostgreSQL accepts
      # connections, so dependent services never run migrations early.
      test: ["CMD-SHELL", "pg_isready -U postgres -d circleup"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Development container ───────────────────────────────────────────────────
  #
  # Full-stack dev environment with Node 22, Rust stable, and stellar-cli.
  # Used by .devcontainer/devcontainer.json for VS Code Dev Containers and
  # GitHub Codespaces.
  #
  # Quick start (no VS Code required):
  #   docker compose up -d
  #   docker compose exec devcontainer bash
  #   npm test                    # 900+ SDK unit tests
  #   cd contracts && cargo test  # Rust contract tests
  #
  # Readiness: this service waits for postgres to report healthy before it
  # starts, so migrations run only against a database ready to accept them.
  # Verify readiness with:
  #   docker compose ps
  #   docker compose exec postgres pg_isready -U postgres -d circleup
  #
  # Restart vs. reset:
  #   - Restart (keeps data):  docker compose restart postgres
  #   - Reset (erases data):   docker compose down -v
  #     `down -v` removes the named `pgdata` volume and is irreversible.
  #     To target only the local database volume explicitly:
  #       docker compose stop postgres
  #       docker volume rm <project>_pgdata
  #     This deletes only disposable local database data; it does not touch
  #     other volumes or user data outside this project.
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - cargo_cache:/usr/local/cargo/registry
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/circleup
      NODE_ENV: development
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
    command: sleep infinity   # keeps container running; connect via exec or VS Code

volumes:
  pgdata:
  node_modules:
  cargo_cache: