[package]
name = "circle_factory"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "29.0.1" }

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
circle       = { path = "../circle", features = ["testutils"] }
reputation   = { path = "../reputation", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
