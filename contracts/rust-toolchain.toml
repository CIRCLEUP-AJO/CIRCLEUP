# Pin the Rust toolchain used to build Soroban contracts.
#
# This file is the SINGLE SOURCE OF TRUTH for the Rust toolchain used to
# build, test, and report on Soroban contracts. Both local development and
# CI must honor this pin so that compiled WASM artifacts are byte-for-byte
# identical across machines (build reproducibility, issue #396), and so that
# local behavior, resource reports, and artifact hashes do not diverge from
# CI (issue #137).
#
# CI reads this file directly (via `rustup` toolchain auto-detection) and
# installs only the targets and components declared below. Local setups must
# use the same pin: running any `cargo`/`rustc` command from within the
# `contracts/` directory (or any subdirectory) automatically selects this
# toolchain through `rustup`. Do not override the toolchain locally (e.g. via
# `RUSTUP_TOOLCHAIN` or `cargo +<other>`), or local builds may diverge from CI.
#
# Required targets:    wasm32-unknown-unknown (contract compilation)
# Required components: rustfmt, clippy (formatting and linting in CI)
#
# The pinned channel below, together with the Soroban SDK version declared
# in the contract Cargo manifests, fully determines the WASM artifact
# hashes recorded in scripts/expected-hashes.json (issue #971). CI reports
# the exact compiler and target versions used for every WASM artifact, and
# any change to the channel or SDK version must be reviewed alongside the
# resulting expected-hashes.json changes.
#
# To update:
#   1. Change the channel below (and/or the Soroban SDK version in the
#      contract Cargo manifests).
#   2. Rebuild all contracts: cargo build --release --target wasm32-unknown-unknown
#   3. Re-run scripts/src/check-artifact-hashes.ts to update expected-hashes.json
#   4. Commit rust-toolchain.toml + expected-hashes.json together.
#
# Stable security updates are adopted deliberately: bump the channel to a
# specific released version (never a floating "stable"), rebuild, and review
# the artifact hash diff as part of the same change. The reproducibility
# workflow rebuilds twice in clean contexts and fails if the reviewed hash
# in expected-hashes.json does not match.

[toolchain]
channel  = "1.81.0"
targets  = ["wasm32-unknown-unknown"]
components = ["rustfmt", "clippy"]